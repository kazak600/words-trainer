<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latvian trainer – design preview</title>
<style>
  :root {
    --bg: #f4f7ff;
    --surface: #ffffff;
    --text: #14182b;
    --muted: #6b7388;
    --border: #e1e7f5;
    --accent: #2f5bea;
    --accent-soft: #e8eeff;
    --accent-text: #ffffff;
    --ok: #1f9d55;
    --ok-soft: #e4f6ec;
    --warn: #b7791f;
    --warn-soft: #fff4cc;
    --bad: #d6334a;
    --bad-soft: #fde8eb;
    --shadow: 0 6px 20px rgba(47, 91, 234, 0.08);
    --stage: #e9edf7;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1424; --surface: #181e33; --text: #eef1fb; --muted: #98a2bd;
      --border: #28304a; --accent: #5b82ff; --accent-soft: #1f2a52; --accent-text: #0f1424;
      --ok: #4cc785; --ok-soft: #14301f; --warn: #f2c14e; --warn-soft: #3a3013;
      --bad: #ff7a8c; --bad-soft: #3a1a22; --shadow: 0 6px 20px rgba(0, 0, 0, 0.35); --stage: #090c18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stage); color: var(--text); padding: 32px 16px 64px; }
  h1 { text-align: center; margin: 0 0 4px; font-size: 1.4rem; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 32px; }
  .grid { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; }
  figure { margin: 0; }
  figcaption { text-align: center; font-weight: 600; margin-top: 10px; }
  figcaption small { display: block; font-weight: 400; color: var(--muted); }

  .phone { width: 340px; height: 700px; background: var(--bg); border-radius: 36px; border: 8px solid #101322;
    overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
  .status { height: 34px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: .75rem; font-weight: 600; }
  .screen { flex: 1; overflow: hidden; padding: 6px 18px 0; display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 6px 0 0; font-size: 1.6rem; }
  .muted { color: var(--muted); }
  .small { font-size: .82rem; }

  .btn { border: 0; border-radius: 999px; min-height: 52px; padding: 0 22px; font: inherit; font-weight: 700; width: 100%;
    background: var(--accent); color: var(--accent-text); }
  .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .btn[disabled] { opacity: .45; }
  .pill-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pill-row .btn { min-height: 56px; padding: 0 4px; font-size: .95rem; }
  .btn.again { background: var(--bad-soft); color: var(--bad); }
  .btn.hard { background: var(--warn-soft); color: var(--warn); }
  .btn.good { background: var(--accent); color: var(--accent-text); }
  .btn.easy { background: var(--ok-soft); color: var(--ok); }

  .card { background: var(--surface); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .review-cta { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .topic { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 6px; }
  .topic b { font-size: 1rem; }
  .chips { display: flex; gap: 6px; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 9px; font-size: .72rem; font-weight: 700; }
  .list { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

  .tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 4px 18px; }
  .tab { text-align: center; font-size: .68rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--accent); font-weight: 700; }

  .progress { height: 10px; background: var(--accent-soft); border-radius: 999px; flex: 1; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .topbar { display: flex; align-items: center; gap: 12px; }
  .x { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); }

  .flash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .lemma { font-size: 2.4rem; font-weight: 800; letter-spacing: -.01em; }
  .translation { font-size: 1.5rem; color: var(--accent); font-weight: 700; }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 12px; font-size: .78rem; font-weight: 700; }
  .bottom { margin-top: auto; padding-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }

  .input { background: #eceff8; border-radius: 999px; min-height: 52px; display: flex; align-items: center; padding: 0 20px; font-size: 1.1rem; }
  @media (prefers-color-scheme: dark) { .input { background: #222a45; } }
  .input .caret { width: 2px; height: 22px; background: var(--accent); margin-left: 1px; }
  .quick { display: flex; gap: 5px; overflow: hidden; background: var(--surface); border-radius: 14px; padding: 6px; border: 1px solid var(--border); }
  .quick span { flex: 1; text-align: center; min-width: 0; padding: 8px 0; border-radius: 10px; background: var(--bg); font-weight: 700; }
  .kbd { background: #d1d5e0; margin: 0 -18px; height: 190px; display: grid; place-items: center; color: #6b7388; font-size: .8rem; }
  @media (prefers-color-scheme: dark) { .kbd { background: #1c2238; } }

  .sentence { font-size: 1.4rem; line-height: 1.5; text-align: center; font-weight: 600; }
  .gap { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--accent); height: 1.1em; vertical-align: baseline; }
  .hint { text-align: center; color: var(--muted); }

  .feedback { border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; }
  .feedback.ok { background: var(--ok-soft); border-color: var(--ok); }
  .feedback.typo { background: var(--warn-soft); border-color: var(--warn); }
  .feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
  .feedback strong { font-size: 1.05rem; }
  .ok strong { color: var(--ok); } .typo strong { color: var(--warn); } .bad strong { color: var(--bad); }
  .diff { font-size: 1.6rem; font-weight: 700; }
  mark.dia { background: #ffd54f; color: #14182b; border-radius: 4px; padding: 0 2px; }
  mark.wrongc { background: #ffcdd2; color: #14182b; border-radius: 4px; padding: 0 2px; }
  .setrow { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  .setrow.on { background: var(--accent-soft); border-color: var(--accent); }
  .setrow.on b::after { content: " ✓"; color: var(--accent); }
  .center { text-align: center; }
  .link { color: var(--muted); text-align: center; text-decoration: underline; }
</style>
</head>
<body>
<h1>Latvian trainer: design preview (stages 22–23)</h1>
<p class="sub">Static mockup, loosely following the Speak screenshots. Follows your system light or dark setting.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4a8 8 0 1 0 7.7 10h-2.1A6 6 0 1 1 12 6c1.7 0 3.1.7 4.2 1.8L13 11h8V3l-2.8 2.8A8 8 0 0 0 12 4z"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path fill="currentColor" d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.3 2.7h4l.3-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></symbol>
  </defs>
</svg>

<div class="grid">

<!-- 1. Home -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <h2>Topics</h2>
      <div class="card review-cta">
        <div class="row"><b>Ready to review</b><span class="tag">12 due</span></div>
        <button class="btn">Review · 12 due</button>
        <span class="muted small center">New today: 3 / 15</span>
      </div>
      <div class="list">
        <div class="topic"><div class="row"><b>Home <span class="muted">Дім</span></b><span class="chips"><span class="chip">A1</span><span class="chip">A2</span></span></div>
          <span class="muted small">24 new · 6 learning · 10 learned</span></div>
        <div class="topic"><div class="row"><b>Food and drink <span class="muted">Їжа і напої</span></b><span class="chips"><span class="chip">A1</span><span class="chip">A2</span><span class="chip">B1</span></span></div>
          <span class="muted small">40 new · 2 learning · 0 learned</span></div>
        <div class="topic"><div class="row"><b>Shopping <span class="muted">Покупки</span></b><span class="chips"><span class="chip">A1</span><span class="chip">A2</span></span></div>
          <span class="muted small">31 new · 0 learning · 0 learned</span></div>
      </div>
    </div>
    <nav class="tabs">
      <div class="tab on"><svg><use href="#i-home"/></svg>Home</div>
      <div class="tab"><svg><use href="#i-review"/></svg>Review</div>
      <div class="tab"><svg><use href="#i-add"/></svg>Add</div>
      <div class="tab"><svg><use href="#i-stats"/></svg>Stats</div>
      <div class="tab"><svg><use href="#i-set"/></svg>Settings</div>
    </nav>
  </div>
  <figcaption>Home<small>Review button with due count, new today, topics</small></figcaption>
</figure>

<!-- 2. Recognition front -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="topbar"><div class="x">✕</div><div class="progress"><i style="width:30%"></i></div></div>
      <div class="card flash" style="flex:1">
        <span class="tag">noun</span>
        <div class="lemma" lang="lv">maize</div>
        <span class="muted small">Tap to reveal</span>
      </div>
      <div class="bottom"><button class="btn" disabled>Show answer</button></div>
    </div>
  </div>
  <figcaption>Recognition card<small>Latvian → Ukrainian, tap to reveal</small></figcaption>
</figure>

<!-- 3. Recognition revealed -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="topbar"><div class="x">✕</div><div class="progress"><i style="width:30%"></i></div></div>
      <div class="card flash" style="flex:1">
        <span class="tag">noun</span>
        <div class="lemma" lang="lv">maize</div>
        <div class="translation">хліб</div>
        <span class="muted small">feminine · 5th declension</span>
      </div>
      <div class="bottom">
        <div class="pill-row">
          <button class="btn again">Again</button><button class="btn hard">Hard</button>
          <button class="btn good">Good</button><button class="btn easy">Easy</button>
        </div>
      </div>
    </div>
  </div>
  <figcaption>Revealed<small>Four grades, FSRS schedules the next review</small></figcaption>
</figure>

<!-- 4. Production typing -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="topbar"><div class="x">✕</div><div class="progress"><i style="width:55%"></i></div></div>
      <div class="flash">
        <span class="tag">Type it in Latvian</span>
        <div class="translation" style="font-size:2rem">хліб</div>
      </div>
      <div class="input"><span>maiz</span><span class="caret"></span></div>
      <div class="quick"><span>ā</span><span>č</span><span>ē</span><span>ģ</span><span>ī</span><span>ķ</span><span>ļ</span><span>ņ</span><span>š</span><span>ū</span><span>ž</span></div>
      <button class="btn">Check</button>
      <div class="kbd">keyboard</div>
    </div>
  </div>
  <figcaption>Production card<small>Diacritic quick-bar above the keyboard</small></figcaption>
</figure>

<!-- 5. Cloze -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="topbar"><div class="x">✕</div><div class="progress"><i style="width:70%"></i></div></div>
      <div class="flash">
        <span class="tag">Type the missing word</span>
        <div class="sentence" lang="lv">Es ēdu <span class="gap"></span> ar sieru.</div>
        <div class="hint">Я їм хліб із сиром.</div>
      </div>
      <div class="input"><span class="muted">…</span><span class="caret"></span></div>
      <div class="quick"><span>ā</span><span>č</span><span>ē</span><span>ģ</span><span>ī</span><span>ķ</span><span>ļ</span><span>ņ</span><span>š</span><span>ū</span><span>ž</span></div>
      <button class="btn" disabled>Check</button>
      <div class="kbd">keyboard</div>
    </div>
  </div>
  <figcaption>Cloze card<small>Sentence with a gap, Ukrainian translation as the hint</small></figcaption>
</figure>

<!-- 6. Feedback: exact -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="topbar"><div class="x">✕</div><div class="progress"><i style="width:55%"></i></div></div>
      <div class="flash">
        <span class="tag">Type it in Latvian</span>
        <div class="translation" style="font-size:2rem">хліб</div>
        <div class="input" style="width:100%;justify-content:center"><b>maize</b></div>
      </div>
      <div class="feedback ok"><strong>Correct</strong><span class="diff" lang="lv">maize</span><span class="muted small">Next review in 3 days</span></div>
      <div class="bottom">
        <button class="btn ghost">Mark as easy</button>
        <button class="btn">Continue</button>
      </div>
    </div>
  </div>
  <figcaption>Exact<small>Optional raise to Easy</small></figcaption>
</figure>

<!-- 7. Feedback: typo -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="topbar"><div class="x">✕</div><div class="progress"><i style="width:55%"></i></div></div>
      <div class="flash">
        <span class="tag">Type it in Latvian</span>
        <div class="translation" style="font-size:2rem">хліб</div>
        <div class="input" style="width:100%;justify-content:center"><b>maize</b></div>
      </div>
      <div class="feedback typo"><strong>Pass with typo</strong><span class="diff" lang="lv">maiz<mark class="dia">ē</mark></span><span class="muted small">Check the accent marks. Short interval, no promotion.</span></div>
      <div class="bottom"><button class="btn">Continue</button></div>
    </div>
  </div>
  <figcaption>Typo<small>Yellow, shows the diff, passes without promoting</small></figcaption>
</figure>

<!-- 8. Feedback: wrong -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="topbar"><div class="x">✕</div><div class="progress"><i style="width:55%"></i></div></div>
      <div class="flash">
        <span class="tag">Type it in Latvian</span>
        <div class="translation" style="font-size:2rem">хліб</div>
        <div class="input" style="width:100%;justify-content:center"><b>piens</b></div>
      </div>
      <div class="feedback bad"><strong>Not quite</strong><span class="diff" lang="lv"><mark class="wrongc">maize</mark></span><span class="muted small">You typed: piens. This card comes back at the end.</span></div>
      <div class="bottom"><button class="btn">Continue</button></div>
    </div>
  </div>
  <figcaption>Wrong<small>Card returns once at the end of the session</small></figcaption>
</figure>

<!-- 9. Settings -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <h2>Settings</h2>
      <b>Language</b>
      <div class="setrow on"><b>Latvian → Ukrainian</b></div>
      <span class="muted small">More decks will appear here later.</span>
      <div class="bottom" style="padding-bottom:12px"><span class="link">Log out</span></div>
    </div>
    <nav class="tabs">
      <div class="tab"><svg><use href="#i-home"/></svg>Home</div>
      <div class="tab"><svg><use href="#i-review"/></svg>Review</div>
      <div class="tab"><svg><use href="#i-add"/></svg>Add</div>
      <div class="tab"><svg><use href="#i-stats"/></svg>Stats</div>
      <div class="tab on"><svg><use href="#i-set"/></svg>Settings</div>
    </nav>
  </div>
  <figcaption>Settings<small>Deck list, logout</small></figcaption>
</figure>

<!-- 10. Summary -->
<figure>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="screen">
      <div class="flash">
        <div style="font-size:3rem">🎉</div>
        <h2>Session complete</h2>
        <span class="muted">12 cards · 10 correct · 2 missed</span>
      </div>
      <div class="bottom"><button class="btn">Another session</button><button class="btn ghost">Home</button></div>
    </div>
  </div>
  <figcaption>Summary<small>"Another session" repeats topic or review</small></figcaption>
</figure>

</div>
</body>
